1.0.0:
    - 'Init plugin'
1.1.0:
    - 'Add display_template column to promo mechanism for translatable campaign pricing display text'
    - add_display_template_to_promo_mechanism.php
1.2.0:
    - 'Custom template toggle with preview partials, enable/disable per mechanism'
1.2.1:
    - 'Fix template placeholder replacement order (longest-first to prevent partial replacement)'
1.2.2:
    - 'Fix clipboard copy fallback for HTTP backend connections'
1.3.0:
    - 'Fix locale-aware display_template resolution (resolve at render time, not cache time)'
1.4.0:
    - 'Add default.htm component partial and onSwitchOffer AJAX handler'
1.4.1:
    - 'Memoize PromoMechanism lookups across pricing tiers (one find per mechanism per request)'
1.4.2:
    - 'Cache offers that have no pricing tiers, decide the campaign date window when the tiers are read rather than when they are cached, version the cache key so entries written by 1.4.1 are ignored instead of misread, and narrow the mechanism cache on the way in so the plugin is clean under phpstan level 10'
1.5.0:
    - 'New default tier text (bold price per unit, e.g. "9,60 EUR/gab. - perkot 10 gab.") in all languages, price placeholder now renders value before currency, display_template field is a plain textarea so admin HTML is stored verbatim, and stored richeditor <p> wrappers are cleaned up once by migration'
    - clean_display_template_richeditor_markup.php
1.5.1:
  - 'Tier render queries drop to one bulk load: the CampaignPricingItem mechanism cache fills from a single PromoMechanism::all() on first use instead of one find() per distinct mechanism, and OfferCampaignPricingStore gains per-request memos (offer to product, product campaign lists, tier lists) with a forgetMemo() hook wired into the cache invalidation handlers.'
1.5.2:
    - 'Drop the non-compound "use Lang;" import from the promo mechanism preview partial. The file has no namespace, so PHP emitted a compile warning that October raised as an exception and the mechanism edit form died on any server whose OPcache was too full to keep the compiled partial.'
