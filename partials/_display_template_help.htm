        background: #28a745;

        border-color: #28a745;
    }
</style>

<script>
(function() {
    function copyToClipboard(sText) {
        // HTTPS: use Clipboard API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(sText);
        }
        // HTTP fallback: textarea + execCommand
        var elTemp = document.createElement('textarea');
        elTemp.value = sText;
        elTemp.style.position = 'fixed';
        elTemp.style.opacity = '0';
        document.body.appendChild(elTemp);
        elTemp.select();
        document.execCommand('copy');
        document.body.removeChild(elTemp);
        return Promise.resolve();
    }

    function init() {
        var elContainer = document.getElementById('campaignPricingTemplateHelp');
        if (!elContainer) return;

        elContainer.querySelectorAll('._cp_var').forEach(function(elTag) {
            elTag.addEventListener('click', function() {
                var sVariable = elTag.getAttribute('data-var');
                var sOriginalText = elTag.textContent;

                copyToClipboard(sVariable).then(function() {
                    elTag.textContent = '✓ Copied!';
                    elTag.classList.add('is-copied');
                    setTimeout(function() {
                        elTag.textContent = sOriginalText;
                        elTag.classList.remove('is-copied');
                    }, 800);
                });
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
